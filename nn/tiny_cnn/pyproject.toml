[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hvx-nn-tiny-cnn"
version = "0.2.0"
description = "TinyCNN lightweighting algorithms for Q6A"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "onnx>=1.16",
  "onnxruntime>=1.23",
  "torch>=2.0",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

