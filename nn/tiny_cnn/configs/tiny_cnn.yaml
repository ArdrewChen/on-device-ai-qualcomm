experiment:
  name: tiny_cnn
  seed: 20261114
  device: auto
  output_dir: artifacts/nn/tiny_cnn

data:
  train_samples: 2048
  val_samples: 512
  input_shape: [1, 3, 32, 32]
  num_classes: 10
  batch_size: 64
  num_workers: 0

teacher:
  widths: [16, 32]
  epochs: 6
  learning_rate: 0.003
  weight_decay: 0.0001

student:
  widths: [8, 16]
  epochs: 8
  learning_rate: 0.004
  weight_decay: 0.0001

distillation:
  temperature: 2.0
  alpha: 0.7

export:
  opset: 17
  calibration_samples: 8

